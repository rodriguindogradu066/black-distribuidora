<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Black Distribuidora | Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0A0A0A;
      --paper: #FFFFFF;
      --mist: #F4F6F8;
      --ice-soft: #E0F2FE;
      --line: #E3E7EB;
      --line-strong: #D1D5DB;
      --muted: #5B6470;
      --ice: #38BDF8;
      --ice-deep: #0369A1;
      --night: #000000;
      --night-2: #141414;
      --ok: #15803D;
      --warn: #B45309;
      --danger: #dc2626;
      --font-display: "Archivo", "Arial Narrow", Arial, sans-serif;
      --font-body: "Inter", system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--mist); font-family: var(--font-body); color: var(--ink); }
    body { min-height: 100vh; }
    a { color: inherit; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .hidden { display: none !important; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

    .admin-shell {
      min-height: 100vh;
      background: linear-gradient(180deg, #0d0d0d 0 72px, #f4f6f8 72px 100%);
    }

    .admin-header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px;
      padding: 14px 20px;
      color: white;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      position: sticky; top: 0; z-index: 20;
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(10px);
    }

    .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; }
    .brand-mark {
      width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center;
      background: var(--ice); color: black; font-family: var(--font-display); font-weight: 900;
    }
    .header-actions { display: flex; align-items: center; gap: 10px; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 42px; padding: 0 16px; border-radius: 10px; border: 0; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; font-size: 12px; text-decoration: none;
    }
    .btn.primary { background: var(--ice); color: var(--night); }
    .btn.dark { background: var(--night); color: var(--paper); }
    .btn.secondary { background: #fff; color: var(--night); border: 1px solid var(--line); }
    .btn.danger { background: rgba(220,38,38,0.12); color: var(--danger); border: 1px solid rgba(220,38,38,0.22); }
    .btn.small { min-height: 32px; padding: 0 10px; font-size: 11px; }

    .container {
      max-width: 1200px; margin: 0 auto;
      padding: 24px 16px 48px;
    }

    .auth-wrap {
      min-height: 70vh; display: grid; place-items: center;
    }

    .auth-card, .panel {
      background: var(--paper); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 12px 30px rgba(0,0,0,0.05);
      overflow: hidden;
    }

    .auth-card {
      width: min(100%, 440px);
      padding: 26px;
    }

    .eyebrow {
      display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ice-deep);
    }
    h1, h2, h3 { margin: 0; }
    .auth-card h1 { margin-top: 10px; font-family: var(--font-display); font-size: clamp(30px, 6vw, 44px); text-transform: uppercase; }
    .auth-card p { color: var(--muted); margin: 10px 0 20px; }

    form.fieldset { display: grid; gap: 14px; }
    .field { display: grid; gap: 8px; }
    label { font-size: 13px; font-weight: 700; color: var(--muted); }
    input, select, textarea {
      width: 100%; border: 1px solid var(--line-strong); border-radius: 10px; background: #fff; min-height: 46px; padding: 10px 12px; color: var(--ink);
    }
    textarea { min-height: 96px; resize: vertical; }
    input[type="checkbox"] { width: 18px; height: 18px; }

    .switch-row { display: flex; align-items: center; gap: 10px; }

    .tabs {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px;
    }
    .tab-btn {
      min-height: 42px; padding: 0 14px; border: 1px solid var(--line-strong); background: #fff; border-radius: 10px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; font-size: 11px;
    }
    .tab-btn.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

    .panel {
      padding: 18px; background: var(--paper);
    }

    .toolbar {
      display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; margin-bottom: 16px;
    }
    .toolbar .searchbox {
      flex: 1 1 220px; max-width: 420px;
    }

    .list-grid {
      display: grid; gap: 12px;
    }
    .list-item {
      display: grid; grid-template-columns: 1.4fr 1fr auto; gap: 10px; align-items: center;
      background: var(--mist); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
    }
    .list-meta { display: flex; flex-direction: column; gap: 4px; }
    .list-meta strong { font-size: 15px; }
    .list-meta small { color: var(--muted); }
    .list-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }

    .badge {
      display: inline-flex; align-items: center; min-height: 24px; padding: 0 8px; border-radius: 999px; background: var(--ice-soft); color: var(--ice-deep); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em;
    }
    .badge.danger { background: rgba(220,38,38,0.08); color: var(--danger); }
    .badge.warn { background: rgba(180,83,9,0.08); color: var(--warn); }

    .form-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px;
    }
    .full { grid-column: 1 / -1; }

    .mini-box {
      background: var(--mist); border: 1px solid var(--line); border-radius: 12px;
      padding: 12px; display: grid; gap: 10px;
    }

    .product-preview {
      width: 100%; max-width: 180px; height: 120px; border-radius: 12px; background: var(--ice-soft); display: grid; place-items: center; overflow: hidden;
      border: 1px solid var(--line);
    }
    .product-preview img { width: 100%; height: 100%; object-fit: cover; }
    .status-message {
      margin-top: 12px; padding: 10px 12px; border-radius: 10px; font-size: 14px; font-weight: 700;
      display: none;
    }
    .status-message.error { display: block; background: rgba(220,38,38,0.08); color: var(--danger); border: 1px solid rgba(220,38,38,0.18); }
    .status-message.success { display: block; background: rgba(21,128,61,0.08); color: var(--ok); border: 1px solid rgba(21,128,61,0.18); }

    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: grid; place-items: center; padding: 18px; z-index: 80;
    }
    .modal-card {
      width: min(100%, 420px); background: #fff; border-radius: 16px; padding: 20px; border: 1px solid var(--line);
    }
    .modal-card h3 { margin-bottom: 10px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }

    @media (max-width: 640px) {
      .list-item { grid-template-columns: 1fr; }
      .list-actions { justify-content: flex-start; }
      .admin-header { padding: 12px 14px; }
      .brand span { display: none; }
      .tabs { overflow-x: auto; flex-wrap: nowrap; }
    }
  </style>
</head>
<body>
  <div class="admin-shell">
    <header class="admin-header">
      <div class="brand">
        <div class="brand-mark">B</div>
        <span>Black Distribuidora | Painel</span>
      </div>
      <div class="header-actions">
        <a class="btn secondary" href="index.html">Ver loja</a>
        <button class="btn dark hidden" id="logout-btn" type="button">Sair</button>
      </div>
    </header>

    <main class="container">
      <section id="login-section" class="auth-wrap">
        <div class="auth-card">
          <span class="eyebrow">Admin</span>
          <h1>Entrar</h1>
          <p>Use o usuário que você criou no Supabase para acessar o painel.</p>
          <form id="login-form" class="fieldset">
            <div class="field">
              <label for="email">E-mail</label>
              <input id="email" type="email" placeholder="admin@blackdistribuidora.com.br" required />
            </div>
            <div class="field">
              <label for="password">Senha</label>
              <input id="password" type="password" placeholder="Sua senha" required />
            </div>
            <button class="btn primary" type="submit">Entrar no painel</button>
          </form>
          <div id="login-message" class="status-message"></div>
        </div>
      </section>

      <section id="app-section" class="hidden">
        <nav class="tabs" aria-label="Abas do painel">
          <button class="tab-btn active" type="button" data-tab="produtos">Produtos</button>
          <button class="tab-btn" type="button" data-tab="combos">Combos</button>
          <button class="tab-btn" type="button" data-tab="categorias">Categorias</button>
          <button class="tab-btn" type="button" data-tab="bairros">Bairros</button>
          <button class="tab-btn" type="button" data-tab="configuracoes">Configurações</button>
        </nav>

        <div class="panel" id="panel-produtos">
          <div class="toolbar">
            <div class="searchbox">
              <input id="product-search" type="search" placeholder="Buscar produto...">
            </div>
            <select id="product-category-filter"></select>
            <button id="new-product-btn" class="btn primary" type="button">Novo produto</button>
          </div>

          <div class="form-grid hidden" id="product-form-wrap">
            <form id="product-form" class="fieldset full" autocomplete="off">
              <input type="hidden" id="product-id">
              <div class="form-grid full">
                <div class="field">
                  <label for="product-nome">Nome</label>
                  <input id="product-nome" required>
                </div>
                <div class="field">
                  <label for="product-categoria">Categoria</label>
                  <select id="product-categoria" required></select>
                </div>
                <div class="field">
                  <label for="product-unidade">Unidade</label>
                  <input id="product-unidade" placeholder="Ex.: 269 ml" required>
                </div>
                <div class="field">
                  <label for="product-preco">Preço</label>
                  <input id="product-preco" inputmode="decimal" placeholder="12,90" required>
                </div>
                <div class="field">
                  <label for="product-ordem">Ordem</label>
                  <input id="product-ordem" type="number" value="0">
                </div>
                <div class="field">
                  <label>Foto</label>
                  <input id="product-foto" type="file" accept="image/*" capture="environment">
                </div>
                <div class="field switch-row">
                  <input id="product-ativo" type="checkbox" checked>
                  <label for="product-ativo">Produto ativo</label>
                </div>
                <div class="field switch-row">
                  <input id="product-estoque" type="checkbox" checked>
                  <label for="product-estoque">Em estoque</label>
                </div>
                <div class="field switch-row">
                  <input id="product-destaque" type="checkbox">
                  <label for="product-destaque">Destaque</label>
                </div>
                <div class="field full">
                  <label>Preview da foto</label>
                  <div class="product-preview" id="product-preview-box"><span>Sem imagem</span></div>
                </div>
              </div>
              <div class="modal-actions">
                <button class="btn secondary" type="button" id="cancel-product-btn">Cancelar</button>
                <button class="btn primary" type="submit">Salvar produto</button>
              </div>
            </form>
          </div>
          <div id="products-list" class="list-grid"></div>
          <div id="product-message" class="status-message"></div>
        </div>

        <div class="panel hidden" id="panel-combos">
          <div class="toolbar">
            <div class="searchbox">
              <input id="combo-search" type="search" placeholder="Buscar combo...">
            </div>
            <button id="new-combo-btn" class="btn primary" type="button">Novo combo</button>
          </div>
          <div class="form-grid hidden" id="combo-form-wrap">
            <form id="combo-form" class="fieldset full" autocomplete="off">
              <input type="hidden" id="combo-id">
              <div class="form-grid full">
                <div class="field">
                  <label for="combo-nome">Nome</label>
                  <input id="combo-nome" required>
                </div>
                <div class="field">
                  <label for="combo-preco">Preço</label>
                  <input id="combo-preco" inputmode="decimal" placeholder="120,00" required>
                </div>
                <div class="field">
                  <label for="combo-ordem">Ordem</label>
                  <input id="combo-ordem" type="number" value="0">
                </div>
                <div class="field">
                  <label for="combo-itens">Itens (um por linha)</label>
                  <textarea id="combo-itens" required></textarea>
                </div>
                <div class="field">
                  <label for="combo-foto">Foto</label>
                  <input id="combo-foto" type="file" accept="image/*" capture="environment">
                </div>
                <div class="field switch-row">
                  <input id="combo-ativo" type="checkbox" checked>
                  <label for="combo-ativo">Combo ativo</label>
                </div>
                <div class="field switch-row">
                  <input id="combo-mais-pedido" type="checkbox">
                  <label for="combo-mais-pedido">Mais pedido</label>
                </div>
                <div class="field full">
                  <label>Preview da foto</label>
                  <div class="product-preview" id="combo-preview-box"><span>Sem imagem</span></div>
                </div>
              </div>
              <div class="modal-actions">
                <button class="btn secondary" type="button" id="cancel-combo-btn">Cancelar</button>
                <button class="btn primary" type="submit">Salvar combo</button>
              </div>
            </form>
          </div>
          <div id="combos-list" class="list-grid"></div>
          <div id="combo-message" class="status-message"></div>
        </div>

        <div class="panel hidden" id="panel-categorias">
          <div class="toolbar">
            <div class="searchbox">
              <input id="categoria-search" type="search" placeholder="Buscar categoria...">
            </div>
            <button id="new-categoria-btn" class="btn primary" type="button">Nova categoria</button>
          </div>

          <div class="form-grid hidden" id="categoria-form-wrap">
            <form id="categoria-form" class="fieldset full" autocomplete="off">
              <input type="hidden" id="categoria-id">
              <div class="form-grid full">
                <div class="field">
                  <label for="categoria-nome">Nome</label>
                  <input id="categoria-nome" required>
                </div>
                <div class="field">
                  <label for="categoria-icone">Ícone</label>
                  <select id="categoria-icone" required>
                    <option value="lata">lata</option>
                    <option value="caixa">caixa</option>
                    <option value="longneck">longneck</option>
                    <option value="whisky">whisky</option>
                    <option value="gin">gin</option>
                    <option value="vinho">vinho</option>
                    <option value="suco">suco</option>
                    <option value="cigarro">cigarro</option>
                    <option value="seda">seda</option>
                    <option value="chocolate">chocolate</option>
                    <option value="miojo">miojo</option>
                    <option value="combo">combo</option>
                  </select>
                </div>
                <div class="field">
                  <label for="categoria-ordem">Ordem</label>
                  <input id="categoria-ordem" type="number" value="0">
                </div>
                <div class="field switch-row">
                  <input id="categoria-ativo" type="checkbox" checked>
                  <label for="categoria-ativo">Categoria ativa</label>
                </div>
                <div class="field switch-row">
                  <input id="categoria-tabacaria" type="checkbox">
                  <label for="categoria-tabacaria">É tabacaria</label>
                </div>
              </div>
              <div class="modal-actions">
                <button class="btn secondary" type="button" id="cancel-categoria-btn">Cancelar</button>
                <button class="btn primary" type="submit">Salvar categoria</button>
              </div>
            </form>
          </div>
          <div id="categorias-list" class="list-grid"></div>
          <div id="categoria-message" class="status-message"></div>
        </div>

        <div class="panel hidden" id="panel-bairros">
          <div class="toolbar">
            <div class="searchbox">
              <input id="bairro-search" type="search" placeholder="Buscar bairro...">
            </div>
            <button id="new-bairro-btn" class="btn primary" type="button">Novo bairro</button>
          </div>

          <div class="form-grid hidden" id="bairro-form-wrap">
            <form id="bairro-form" class="fieldset full" autocomplete="off">
              <input type="hidden" id="bairro-id">
              <div class="form-grid full">
                <div class="field">
                  <label for="bairro-nome">Nome</label>
                  <input id="bairro-nome" required>
                </div>
                <div class="field">
                  <label for="bairro-taxa">Taxa de entrega</label>
                  <input id="bairro-taxa" inputmode="decimal" placeholder="6,00" required>
                </div>
                <div class="field">
                  <label for="bairro-ordem">Ordem</label>
                  <input id="bairro-ordem" type="number" value="0">
                </div>
                <div class="field switch-row">
                  <input id="bairro-ativo" type="checkbox" checked>
                  <label for="bairro-ativo">Ativo</label>
                </div>
              </div>
              <div class="modal-actions">
                <button class="btn secondary" type="button" id="cancel-bairro-btn">Cancelar</button>
                <button class="btn primary" type="submit">Salvar bairro</button>
              </div>
            </form>
          </div>
          <div id="bairros-list" class="list-grid"></div>
          <div id="bairro-message" class="status-message"></div>
        </div>

        <div class="panel hidden" id="panel-configuracoes">
          <form id="config-form" class="fieldset">
            <div class="form-grid full">
              <div class="field">
                <label for="config-whatsapp">WhatsApp</label>
                <input id="config-whatsapp" required placeholder="5563999998888">
              </div>
              <div class="field">
                <label for="config-whatsapp-exibir">WhatsApp para exibir</label>
                <input id="config-whatsapp-exibir" required placeholder="(63) 9 9999-8888">
              </div>
              <div class="field">
                <label for="config-chave-pix">Chave Pix</label>
                <input id="config-chave-pix">
              </div>
              <div class="field">
                <label for="config-nome-pix">Nome Pix</label>
                <input id="config-nome-pix" required>
              </div>
              <div class="field">
                <label for="config-pedido-minimo">Pedido mínimo</label>
                <input id="config-pedido-minimo" inputmode="decimal" required>
              </div>
              <div class="field">
                <label for="config-abre">Abre</label>
                <input id="config-abre" placeholder="08:00" required>
              </div>
              <div class="field">
                <label for="config-fecha">Fecha</label>
                <input id="config-fecha" placeholder="23:00" required>
              </div>
              <div class="field">
                <label for="config-tempo">Tempo de entrega</label>
                <input id="config-tempo" placeholder="30 a 50 min" required>
              </div>
              <div class="field full">
                <label for="config-endereco">Endereço</label>
                <input id="config-endereco" required>
              </div>
              <div class="field full">
                <label for="config-cnpj">CNPJ</label>
                <input id="config-cnpj" required>
              </div>
            </div>
            <div class="modal-actions">
              <button class="btn primary" type="submit">Salvar configurações</button>
            </div>
          </form>
          <div id="config-message" class="status-message"></div>
        </div>
      </section>
    </main>
  </div>

  <div id="confirm-modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <h3>Confirmar exclusão</h3>
      <p id="confirm-text">Deseja realmente excluir este item?</p>
      <div class="modal-actions">
        <button type="button" class="btn secondary" id="cancel-delete-btn">Cancelar</button>
        <button type="button" class="btn danger" id="confirm-delete-btn">Excluir</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.53.0/dist/umd/supabase.js"></script>
  <script>
    const appState = {
      user: null,
      activeTab: 'produtos',
      categories: [],
      products: [],
      combos: [],
      bairros: [],
      config: null,
      editingProductId: null,
      editingComboId: null,
      editingCategoriaId: null,
      editingBairroId: null,
      pendingDelete: null,
      productPhotoUrl: '',
      comboPhotoUrl: ''
    };

    function showMessage(elementId, text, type) {
      const el = document.getElementById(elementId);
      if (!el) return;
      el.textContent = text;
      el.className = 'status-message ' + type;
    }

    function parseCurrency(value) {
      if (value === null || value === undefined || value === '') return 0;
      const clean = String(value).replace(/[R$\s.]/g, '').replace(',', '.');
      const parsed = Number(clean);
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function formatCurrency(value) {
      const num = Number(value || 0);
      return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(num);
    }

    function getSupabaseClient() {
      const cfg = window.BLACK_DISTRIBUIDORA_CONFIG || {};
      if (!cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY || cfg.SUPABASE_URL.includes('SEU_PROJETO') || cfg.SUPABASE_ANON_KEY.includes('SUA_ANON')) {
        throw new Error('Configure a URL e a anon key do Supabase em config.js.');
      }
      return window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
    }

    function setActiveTab(tabName) {
      appState.activeTab = tabName;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.tab === tabName));
      document.querySelectorAll('.panel[id^="panel-"]').forEach(panel => {
        const visible = panel.id === 'panel-' + tabName;
        panel.classList.toggle('hidden', !visible);
      });
    }

    async function ensureAuth() {
      const supabase = getSupabaseClient();
      const { data, error } = await supabase.auth.getSession();
      if (error) throw error;
      appState.user = data.session?.user || null;
      document.getElementById('login-section').classList.toggle('hidden', !!appState.user);
      document.getElementById('app-section').classList.toggle('hidden', !appState.user);
      document.getElementById('logout-btn').classList.toggle('hidden', !appState.user);
      if (appState.user) {
        await loadAllData();
      }
    }

    async function loadAllData() {
      const supabase = getSupabaseClient();
      const [catResult, prodResult, comboResult, bairroResult, configResult] = await Promise.all([
        supabase.from('categorias').select('*').eq('ativo', true).order('ordem', { ascending: true }),
        supabase.from('produtos').select('*').order('ordem', { ascending: true }),
        supabase.from('combos').select('*').eq('ativo', true).order('ordem', { ascending: true }),
        supabase.from('bairros').select('*').eq('ativo', true).order('ordem', { ascending: true }),
        supabase.from('config_loja').select('*').limit(1)
      ]);

      if (catResult.error) throw catResult.error;
      if (prodResult.error) throw prodResult.error;
      if (comboResult.error) throw comboResult.error;
      if (bairroResult.error) throw bairroResult.error;
      if (configResult.error) throw configResult.error;

      appState.categories = catResult.data || [];
      appState.products = prodResult.data || [];
      appState.combos = comboResult.data || [];
      appState.bairros = bairroResult.data || [];
      appState.config = configResult.data?.[0] || null;

      populateCategorySelects();
      renderProducts();
      renderCombos();
      renderCategorias();
      renderBairros();
      renderConfigForm();
    }

    function populateCategorySelects() {
      const options = appState.categories.map(c => `<option value="${c.id}">${c.nome}</option>`).join('');
      document.getElementById('product-categoria').innerHTML = options || '<option value="">Nenhuma categoria</option>';
      document.getElementById('product-category-filter').innerHTML = '<option value="all">Todas</option>' + options;
      document.getElementById('product-category-filter').value = 'all';
    }

    function renderProducts() {
      const list = document.getElementById('products-list');
      const query = document.getElementById('product-search').value.toLowerCase();
      const filterCat = document.getElementById('product-category-filter').value;
      const items = appState.products.filter(item => {
        const matchesQuery = !query || item.nome.toLowerCase().includes(query) || item.descricao_unidade.toLowerCase().includes(query);
        const matchesCat = filterCat === 'all' || item.categoria_id === filterCat;
        return matchesQuery && matchesCat;
      });

      if (!items.length) {
        list.innerHTML = '<div class="empty mini-box"><strong>Nenhum produto encontrado.</strong></div>';
        return;
      }

      list.innerHTML = items.map(product => {
        const category = appState.categories.find(c => c.id === product.categoria_id);
        const status = product.em_estoque ? '<span class="badge">Em estoque</span>' : '<span class="badge warn">Esgotado</span>';
        const active = product.ativo ? '<span class="badge">Ativo</span>' : '<span class="badge danger">Pausado</span>';
        const price = formatCurrency(product.preco);
        return `
          <div class="list-item">
            <div class="list-meta">
              <strong>${product.nome}</strong>
              <small>${category?.nome || 'Categoria'} · ${product.descricao_unidade}</small>
              <small>${price}</small>
            </div>
            <div class="list-actions">
              ${status}
              ${active}
            </div>
            <div class="list-actions">
              <button class="btn small secondary" type="button" data-action="toggle-stock" data-id="${product.id}">${product.em_estoque ? 'Esgotado' : 'Disponível'}</button>
              <button class="btn small secondary" type="button" data-action="toggle-active" data-id="${product.id}">${product.ativo ? 'Pausar' : 'Ativar'}</button>
              <button class="btn small secondary" type="button" data-action="edit-product" data-id="${product.id}">Editar</button>
              <button class="btn small danger" type="button" data-action="delete-product" data-id="${product.id}">Apagar</button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function uploadImage(file, prefix = 'produtos') {
      if (!file) return null;
      const ext = file.name.split('.').pop() || 'jpg';
      const fileName = `${prefix}/${Date.now()}-${Math.random().toString(16).slice(2)}.${ext}`;
      const supabase = getSupabaseClient();
      const { error } = await supabase.storage.from('fotos').upload(fileName, file, {
        cacheControl: '3600',
        upsert: true
      });
      if (error) throw error;
      const { data } = supabase.storage.from('fotos').getPublicUrl(fileName);
      return data.publicUrl;
    }

    function resizeImage(file, maxWidth = 800, quality = 0.82) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = function () {
          const img = new Image();
          img.onload = function () {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            canvas.toBlob(blob => {
              if (!blob) return reject(new Error('Não foi possível processar a imagem.'));
              resolve(new File([blob], file.name || 'foto.jpg', { type: 'image/jpeg' }));
            }, 'image/jpeg', quality);
          };
          img.onerror = () => reject(new Error('A imagem selecionada não pôde ser lida.'));
          img.src = reader.result;
        };
        reader.onerror = () => reject(new Error('Falha ao ler a imagem.'));
        reader.readAsDataURL(file);
      });
    }

    async function handleProductSave(event) {
      event.preventDefault();
      const supabase = getSupabaseClient();
      const form = event.currentTarget;
      const payload = {
        nome: document.getElementById('product-nome').value.trim(),
        categoria_id: document.getElementById('product-categoria').value,
        descricao_unidade: document.getElementById('product-unidade').value.trim(),
        preco: parseCurrency(document.getElementById('product-preco').value),
        ativo: document.getElementById('product-ativo').checked,
        em_estoque: document.getElementById('product-estoque').checked,
        destaque: document.getElementById('product-destaque').checked,
        ordem: Number(document.getElementById('product-ordem').value || 0),
        foto_url: appState.productPhotoUrl || null
      };

      if (!payload.nome || !payload.categoria_id || !payload.descricao_unidade) {
        showMessage('product-message', 'Preencha todos os campos obrigatórios.', 'error');
        return;
      }

      try {
        const file = document.getElementById('product-foto').files[0];
        if (file) {
          const compressed = await resizeImage(file, 800, 0.82);
          payload.foto_url = await uploadImage(compressed, 'produtos');
        }

        let result;
        if (appState.editingProductId) {
          result = await supabase.from('produtos').update(payload).eq('id', appState.editingProductId);
        } else {
          result = await supabase.from('produtos').insert([payload]);
        }
        if (result.error) throw result.error;
        showMessage('product-message', appState.editingProductId ? 'Produto atualizado com sucesso.' : 'Produto salvo com sucesso.', 'success');
        form.reset();
        resetProductForm();
        await loadAllData();
      } catch (error) {
        showMessage('product-message', 'Erro ao salvar produto: ' + error.message, 'error');
      }
    }

      if (!action) return;
      const id = event.target.dataset.id;

      if (action === 'edit-product') {
        const item = appState.products.find(p => p.id === id);
        if (!item) return;
        appState.editingProductId = id;
        appState.productPhotoUrl = item.foto_url || '';
        document.getElementById('product-id').value = id;
        document.getElementById('product-nome').value = item.nome || '';
        document.getElementById('product-categoria').value = item.categoria_id || '';

        document.getElementById('product-estoque').checked = !!item.em_estoque;
        document.getElementById('product-destaque').checked = !!item.destaque;

        const item = appState.combos.find(c => c.id === id);
        if (!item) return;
        appState.editingComboId = id;
        appState.comboPhotoUrl = item.foto_url || '';
        document.getElementById('combo-id').value = id;
        document.getElementById('combo-nome').value = item.nome || '';
        document.getElementById('combo-preco').value = item.preco || 0;
        document.getElementById('combo-ordem').value = item.ordem || 0;
        document.getElementById('combo-itens').value = (item.itens || []).join('\n');
        document.getElementById('combo-ativo').checked = !!item.ativo;
        document.getElementById('combo-mais-pedido').checked = !!item.mais_pedido;
        document.getElementById('combo-foto').value = '';
        document.getElementById('combo-preview-box').innerHTML = item.foto_url ? `<img src="${item.foto_url}" alt="Preview do combo">` : '<span>Sem imagem</span>';
        document.getElementById('combo-form-wrap').classList.remove('hidden');
        return;
      }

      if (action === 'edit-categoria') {
        const item = appState.categories.find(c => c.id === id);
        if (!item) return;
        appState.editingCategoriaId = id;
        document.getElementById('categoria-id').value = id;
        document.getElementById('categoria-nome').value = item.nome || '';
        document.getElementById('categoria-icone').value = item.icone || 'lata';
        document.getElementById('categoria-ordem').value = item.ordem || 0;
        document.getElementById('categoria-ativo').checked = !!item.ativo;
        document.getElementById('categoria-tabacaria').checked = !!item.tabacaria;
        document.getElementById('categoria-form-wrap').classList.remove('hidden');
        return;
      }

      if (action === 'edit-bairro') {
        const item = appState.bairros.find(b => b.id === id);
        if (!item) return;
        appState.editingBairroId = id;
        document.getElementById('bairro-id').value = id;
        document.getElementById('bairro-nome').value = item.nome || '';
        document.getElementById('bairro-taxa').value = item.taxa_entrega || 0;
        document.getElementById('bairro-ordem').value = item.ordem || 0;
        document.getElementById('bairro-ativo').checked = !!item.ativo;
        document.getElementById('bairro-form-wrap').classList.remove('hidden');
        return;
      }

      if (action === 'toggle-stock') {
        const item = appState.products.find(p => p.id === id);
        if (!item) return;
        const supabase = getSupabaseClient();
        const { error } = await supabase.from('produtos').update({ em_estoque: !item.em_estoque }).eq('id', id);
        if (error) throw error;
        await loadAllData();
        return;
      }

      if (action === 'toggle-active') {
        const item = appState.products.find(p => p.id === id);
        if (!item) return;
        const supabase = getSupabaseClient();
        const { error } = await supabase.from('produtos').update({ ativo: !item.ativo }).eq('id', id);
        if (error) throw error;
        await loadAllData();
        return;
      }

      if (action === 'toggle-combo-active') {
        const item = appState.combos.find(c => c.id === id);
        if (!item) return;
        const supabase = getSupabaseClient();
        const { error } = await supabase.from('combos').update({ ativo: !item.ativo }).eq('id', id);
        if (error) throw error;
        await loadAllData();
        return;
      }

      if (action === 'delete-product') {
        showConfirmModal('Deseja apagar este produto do catálogo?', async () => {
          try { await deleteById('produtos', id); await loadAllData(); closeConfirmModal(); } catch (error) { showMessage('product-message', 'Erro ao apagar produto: ' + error.message, 'error'); }
        });
        return;

        });
        return;
      }

      if (action === 'delete-categoria') {
        showConfirmModal('Deseja apagar esta categoria? Isso pode afetar produtos vinculados.', async () => {
          try { await deleteById('categorias', id); await loadAllData(); closeConfirmModal(); } catch (error) { showMessage('categoria-message', 'Erro ao apagar categoria: ' + error.message, 'error'); }
        });
        return;
      }

      if (action === 'delete-bairro') {
        showConfirmModal('Deseja apagar este bairro?', async () => {
          try { await deleteById('bairros', id); await loadAllData(); closeConfirmModal(); } catch (error) { showMessage('bairro-message', 'Erro ao apagar bairro: ' + error.message, 'error'); }
        });
      }
    });

    document.getElementById('login-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const supabase = getSupabaseClient();
      try {
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        await ensureAuth();
      } catch (error) {
        showMessage('login-message', 'Não foi possível entrar: ' + error.message, 'error');
      }
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      const supabase = getSupabaseClient();
      await supabase.auth.signOut();
      appState.user = null;
      document.getElementById('login-section').classList.remove('hidden');
      document.getElementById('app-section').classList.add('hidden');
      document.getElementById('logout-btn').classList.add('hidden');
    });

    document.getElementById('new-product-btn').addEventListener('click', resetProductForm);
    document.getElementById('cancel-product-btn').addEventListener('click', () => document.getElementById('product-form-wrap').classList.add('hidden'));
    document.getElementById('new-combo-btn').addEventListener('click', resetComboForm);
    document.getElementById('cancel-combo-btn').addEventListener('click', () => document.getElementById('combo-form-wrap').classList.add('hidden'));
    document.getElementById('new-categoria-btn').addEventListener('click', resetCategoriaForm);
    document.getElementById('cancel-categoria-btn').addEventListener('click', () => document.getElementById('categoria-form-wrap').classList.add('hidden'));
    document.getElementById('new-bairro-btn').addEventListener('click', resetBairroForm);
    document.getElementById('cancel-bairro-btn').addEventListener('click', () => document.getElementById('bairro-form-wrap').classList.add('hidden'));

    document.getElementById('product-form').addEventListener('submit', handleProductSave);
    document.getElementById('combo-form').addEventListener('submit', handleComboSave);
    document.getElementById('categoria-form').addEventListener('submit', handleCategoriaSave);
    document.getElementById('bairro-form').addEventListener('submit', handleBairroSave);
    document.getElementById('config-form').addEventListener('submit', handleConfigSave);
    document.getElementById('cancel-delete-btn').addEventListener('click', closeConfirmModal);
    document.getElementById('confirm-delete-btn').addEventListener('click', async () => {
      if (typeof appState.pendingDelete === 'function') {
        await appState.pendingDelete();
      }
      closeConfirmModal();
    });

    document.getElementById('product-foto').addEventListener('change', (event) => {
      const [file] = event.target.files;
      if (!file) return;
      const preview = document.getElementById('product-preview-box');
      const reader = new FileReader();
      reader.onload = (ev) => { preview.innerHTML = `<img src="${ev.target.result}" alt="Preview do produto">`; };
      reader.readAsDataURL(file);
    });

    document.getElementById('combo-foto').addEventListener('change', (event) => {
      const [file] = event.target.files;
      if (!file) return;
      const preview = document.getElementById('combo-preview-box');
      const reader = new FileReader();
      reader.onload = (ev) => { preview.innerHTML = `<img src="${ev.target.result}" alt="Preview do combo">`; };
      reader.readAsDataURL(file);
    });

    document.getElementById('product-search').addEventListener('input', renderProducts);
    document.getElementById('combo-search').addEventListener('input', renderCombos);
    document.getElementById('categoria-search').addEventListener('input', renderCategorias);
    document.getElementById('bairro-search').addEventListener('input', renderBairros);
    document.getElementById('product-category-filter').addEventListener('change', renderProducts);

    document.querySelectorAll('.tab-btn').forEach(button => {
      button.addEventListener('click', () => setActiveTab(button.dataset.tab));
    });

    window.addEventListener('DOMContentLoaded', async () => {
      try {
        await ensureAuth();
      } catch (error) {
        showMessage('login-message', error.message, 'error');
      }
    });
  </script>
</body>
</html>
